# ---------------------------------------------------------------------------
# config_holdout.yaml — the 10-paper pilot set for the procedural-unit
# pipeline (Araho, Chazan, Coutouly, Desrosiers & Gendron, Li, Malinsky-Buller,
# Rankama & Kankaanpaa, Shimelmitz x2, Stout 2014).
#
# Deliberately written to a SEPARATE output directory from
# pdfs_ocr_figures_pilot, so this set stays a genuine holdout: no pass0/pass1
# prompt or threshold has ever been tuned against these papers, and keeping
# them physically apart makes it hard to blur that by accident.
#
# Unlike the pilot ten, these are OCR'd with table geometry, multi-region
# provenance and normalized BOTTOMLEFT origins from the start.
#
# Usage:
#   uv run python run.py --config config_holdout.yaml
# ---------------------------------------------------------------------------

pdf_input:  'C:\Users\jpaige\Box\4. Research\LLM_segmenting_procedural_units\pdfs'
output_dir: 'C:\Users\jpaige\Box\4. Research\LLM_segmenting_procedural_units\pdfs_ocr_figures_pilot'

# The input folder holds all 20 papers; this restricts the run to the 10 that
# are not already processed in pdfs_ocr_figures_pilot.
file_list: 'file_lists/pilot_10.txt'

chunk_size: 50
force_reprocess: true

docling:
  do_ocr: true
  # Figures are needed downstream: figures.json supplies the bbox + caption
  # that classify_figures.py, figure_captioner and annotate_layers.py all read.
  extract_figures: true
  figures_scale: 2.0

  # Docling's picture classifier: a local image-classification model
  # (DocumentFigureClassifier-v2.5, weights already in this machine's HF
  # cache) run in-process. It makes no network call of any kind — it is a
  # different stage from docling's picture *description*, which POSTs images
  # to an HTTP endpoint and is refused outright at startup by
  # build_converter's _REMOTE_PICTURE_DESCRIPTION_KEYS guard.
  #
  # Run this with compilation disabled:
  #
  #   DOCLING_INFERENCE_COMPILE_TORCH_MODELS=0 uv run python run.py --config config_holdout.yaml
  #
  # The engine calls torch.compile() when its compile_model option is set,
  # which defaults from settings.inference.compile_torch_models (True).
  # Compiling asks Inductor for a GPU kernel, which requires Triton — not
  # available on Windows, and it fails hard with TritonMissing. The env var
  # above is docling's own supported setting (AppSettings uses env_prefix
  # "DOCLING_"), so the model simply runs eagerly instead. Same local
  # weights, same local execution, no Triton in the path.
  classify_figures: true

  # DO NOT set delete_figure_classes on this corpus, despite what
  # config.example.yaml recommends. Its ['logo', 'icon'] list was verified
  # against a different corpus (publisher chrome: mastheads, CrossRef
  # badges). On lithic journal papers the classifier calls artefact plates
  # `icon`: Araho et al. 2002 came back with 10 of 19 figures tagged `icon`,
  # among them "Fig. 1 Nearly complete example of a Type 1 stemmed tool",
  # "Fig. 2 Type 2 stemmed tool" and "Fig. 3 Type 2 stemmed tool" — the
  # paper's primary artefact photographs. Enabling deletion here would have
  # destroyed them at extraction time, unrecoverably and without a warning.
  #
  # Treat `classification` as a weak hint only. Figure semantics for this
  # pipeline come from site_form_segmenter/classify_figures.py (qwen2.5vl),
  # which is multi-label and scored against the project's own class list.
