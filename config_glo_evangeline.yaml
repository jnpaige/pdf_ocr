# GLO survey field notes — Evangeline (43 PDFs, ~10,820 pages total)
pdf_input:  'C:\Users\jpaige\Desktop\local_repositories\GLO_survey_notes_ocr\Glo_map_field_notes_evangeline'
output_dir: 'C:\Users\jpaige\Desktop\local_repositories\GLO_survey_notes_ocr\Glo_map_field_notes_evangeline_ocr'

# false: overwrite existing outputs in place — needed to pick up the
# _build_searchable_pdf / bbox-persistence fix in lib/ocr_docling.py, since
# every document already has a completed ocr_docling.json from before that
# fix existed.
skip_existing: false

# skip_existing: false alone isn't enough for large PDFs: process_pdf_chunked
# also caches each chunk's results under _chunks/<chunk>/ocr_docling.json so
# a crashed run can resume without redoing finished chunks, and that cache
# is separate from skip_existing. Every chunk in this corpus is already
# cached from before the ocr_docling.py fix, so without force_reprocess the
# run would silently just re-merge stale pre-fix chunk results. See run.py's
# _load_chunk_results docstring.
force_reprocess: true

# Large PDFs (up to ~430 pages) are split into 50-page chunks before OCR so a
# crash only loses the in-progress chunk, not the whole file.
chunk_size: 50
